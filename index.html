  <body>
    <div class="auth-bar" aria-label="Tài khoản">
      <span class="account-name" id="account-name" hidden></span>
      <button class="auth-button" id="login-button" type="button">LOGIN</button>
      <button class="auth-button" id="signup-button" type="button">SIGN UP</button>
      <button class="logout-button" id="logout-button" type="button" hidden>LOG OUT</button>
    </div>
    <div class="page-shell">
      <main>
        <h1>AVOID CYBERCRIME</h1>

    <dialog id="auth-dialog" aria-labelledby="auth-title">
      <form class="dialog-content" id="auth-form" novalidate>
        <h2 class="dialog-title" id="auth-title">LOGIN</h2>
        <label class="form-field">USERNAME <input id="username" name="username" autocomplete="username" minlength="4" required /></label>
        <label class="form-field">PASSWORD <input id="password" name="password" type="password" autocomplete="current-password" minlength="4" required /></label>
        <p class="form-hint" id="auth-hint">Tối thiểu 4 ký tự cho username và password.</p>
        <p class="form-message" id="auth-message" role="status"></p>
        <div class="form-actions"><button class="form-cancel" id="cancel-auth" type="button">HỦY</button><button class="form-submit" id="submit-auth" type="submit">LOGIN</button></div>
      </form>
    </dialog>
    <script type="module" src="js/auth.js"></script>
